    // ── Global hover bubble ─────────────────────────────────────────────
    var bubble = document.createElement('div');
    bubble.className = 'win-bubble';
    document.body.appendChild(bubble);

    function showBubble(win, text, compact) {
      bubble.textContent = text;
      bubble.style.width      = compact ? 'auto' : '220px';
      bubble.style.whiteSpace = compact ? 'nowrap' : 'normal';
      var rect = win.getBoundingClientRect();
      bubble.style.left = rect.left + 'px';
      bubble.style.top  = (rect.bottom + 10) + 'px';
      bubble.classList.add('visible');
    }
    function hideBubble() { bubble.classList.remove('visible'); }

    // ── Core window builder ─────────────────────────────────────────────
    var zTop = 10;

    function buildGalleryInCanvas(canvas, defs) {
      defs.forEach(function (def, i) {
        var win = document.createElement('div');
        win.className = 'win';
        win.style.width     = def.w + 'px';
        win.style.transform = 'rotate(' + def.r + 'deg)';
        win.style.zIndex    = i + 1;
        win.dataset.lp     = def.lp;
        win.dataset.t      = def.t;
        win.dataset.center = def.center ? '1' : '';

        // Title bar
        var bar = document.createElement('div');
        bar.className = 'win-bar';
        var titleEl = document.createElement('span');
        titleEl.innerHTML = def.label;
        bar.appendChild(titleEl);
        var dots = document.createElement('div');
        dots.className = 'win-bar-dots';
        for (var d = 0; d < 9; d++) { dots.appendChild(document.createElement('span')); }
        bar.appendChild(dots);
        win.appendChild(bar);

        // Body
        var body = document.createElement('div');
        body.className = 'win-body';
        if (def.type === 'info') {
          var info = document.createElement('div');
          info.className = 'win-info';
          info.innerHTML = def.html || '';
          body.appendChild(info);
        } else if (def.src) {
          var img = document.createElement('img');
          img.src = def.src;
          img.alt = def.label;
          body.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'win-placeholder';
          body.appendChild(ph);
        }
        win.appendChild(body);
        canvas.appendChild(win);

        // Drag
        var dragging = false, didDrag = false, startMX, startMY, startL, startT;
        bar.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          e.preventDefault();
          dragging = true;
          didDrag  = false;
          win.classList.add('dragging');
          win.style.zIndex = ++zTop;
          win.dataset.dragged = '1';
          document.body.style.cursor = 'grabbing';
          document.body.style.userSelect = 'none';
          startMX = e.clientX; startMY = e.clientY;
          startL  = win.offsetLeft; startT = win.offsetTop;
          function onMove(e) {
            if (!dragging) return;
            didDrag = true;
            win.style.left = (startL + e.clientX - startMX) + 'px';
            win.style.top  = (startT + e.clientY - startMY) + 'px';
            if (bubble.classList.contains('visible')) {
              var r = win.getBoundingClientRect();
              bubble.style.left = r.left + 'px';
              bubble.style.top  = (r.bottom + 10) + 'px';
            }
          }
          function onUp() {
            dragging = false;
            win.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
        win.addEventListener('mousedown', function () { win.style.zIndex = ++zTop; });

        var tipText    = def.tip || (def.url ? '↗ ' + decodeURIComponent(def.url).replace('https://', '') : null);
        var tipCompact = !def.tip && !!def.url;
        if (tipText) {
          win.addEventListener('mouseenter', function () { showBubble(win, tipText, tipCompact); });
          win.addEventListener('mouseleave', hideBubble);
        }
        if (def.url) {
          body.style.cursor = 'pointer';
          body.addEventListener('click', function () {
            if (!didDrag) window.open(def.url, '_blank');
          });
        }
      });
    }

    // ── Section builder ─────────────────────────────────────────────────
    var venueMap = null;

    function buildSection(sectionId, data) {
      if (Array.isArray(data)) {
        buildGalleryInCanvas(
          document.querySelector('#' + sectionId + ' .gallery-canvas'),
          data
        );
      } else if (data.subgroups) {
        var section = document.getElementById(sectionId);
        data.subgroups.forEach(function (group) {
          var sg = document.createElement('div');
          sg.className = 'subgroup';
          var heading = document.createElement('h3');
          heading.className = 'subgroup-title';
          heading.textContent = group.title;
          sg.appendChild(heading);
          var canvas = document.createElement('div');
          canvas.className = 'gallery-canvas';
          canvas.style.height = (group.height || 340) + 'px';
          sg.appendChild(canvas);
          section.appendChild(sg);
          buildGalleryInCanvas(canvas, group.cards);
        });
      } else if (data.mapLayout) {
        var section = document.getElementById(sectionId);

        var layout = document.createElement('div');
        layout.className = 'eat-drink-layout';

        var canvas = document.createElement('div');
        canvas.className = 'gallery-canvas eat-canvas';
        canvas.style.height = (data.canvasHeight || 720) + 'px';
        layout.appendChild(canvas);

        var mapEl = document.createElement('div');
        mapEl.id  = sectionId + '-map';
        mapEl.className = 'venue-map';
        layout.appendChild(mapEl);

        section.appendChild(layout);
        buildGalleryInCanvas(canvas, data.cards);

        // store config for deferred init
        mapEl.dataset.center = JSON.stringify(data.mapCenter);
        mapEl.dataset.zoom   = data.mapZoom;
        mapEl.dataset.venues = JSON.stringify(
          data.cards.filter(function(c){ return c.lat; }).map(function(c,i){
            return { name: c.label, lat: c.lat, lng: c.lng, n: i + 1 };
          })
        );
      }
    }

    // ── Venue map init (deferred until section shown) ───────────────────
    function initVenueMap(mapEl) {
      if (mapEl._mapReady) return;
      mapEl._mapReady = true;

      var center = JSON.parse(mapEl.dataset.center);
      var zoom   = parseInt(mapEl.dataset.zoom, 10);
      var venues = JSON.parse(mapEl.dataset.venues);

      venueMap = L.map(mapEl, { zoomControl: true }).setView(center, zoom);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(venueMap);

      venues.forEach(function (v) {
        var icon = L.divIcon({
          className: '',
          html: '<div class="map-pin">' + v.n + '</div>',
          iconSize:   [26, 26],
          iconAnchor: [13, 13],
          popupAnchor:[0, -16]
        });
        L.marker([v.lat, v.lng], { icon: icon })
          .addTo(venueMap)
          .bindPopup('<b>' + v.name + '</b>');
      });
    }

    // ── Position windows ────────────────────────────────────────────────
    function positionSection(id) {
      var section = document.getElementById(id);
      if (!section) return;
      section.querySelectorAll('.gallery-canvas').forEach(function (canvas) {
        var W = canvas.offsetWidth;
        canvas.querySelectorAll('.win').forEach(function (win) {
          if (!win.dataset.dragged) {
            win.style.left = win.dataset.center === '1'
              ? Math.round((W - win.offsetWidth) / 2) + 'px'
              : Math.round(parseFloat(win.dataset.lp) * W) + 'px';
            win.style.top  = win.dataset.t + 'px';
          }
        });
      });
    }

    // ── Navigation ──────────────────────────────────────────────────────
    function navigate() {
      var hash = window.location.hash || '#travel';
      document.querySelectorAll('.gallery-section').forEach(function (s) { s.classList.add('hidden'); });
      document.querySelectorAll('.nav-link').forEach(function (l) { l.classList.remove('active'); });
      var section = document.querySelector(hash);
      var link    = document.querySelector('a[href="' + hash + '"]');
      if (section) {
        section.classList.remove('hidden');
        positionSection(hash.slice(1));
        // Init map if this is the eat-drink section
        var mapEl = section.querySelector('.venue-map');
        if (mapEl) {
          setTimeout(function () {
            initVenueMap(mapEl);
            if (venueMap) venueMap.invalidateSize();
          }, 50);
        }
      }
      if (link) link.classList.add('active');
      hideBubble();
    }

    // ── Init ────────────────────────────────────────────────────────────
    Object.keys(SECTIONS).forEach(function (id) { buildSection(id, SECTIONS[id]); });
    navigate();
    window.addEventListener('hashchange', navigate);
    window.addEventListener('resize', function () {
      positionSection((window.location.hash || '#travel').slice(1));
      if (venueMap) venueMap.invalidateSize();
    });

  })();
