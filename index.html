<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prague Yay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital@1&family=Inter:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>

      <!-- ── Logo ──────────────────────────────────────── -->
      <div class="logo">
        <div class="logo-mark">
          <div class="logo-panel">
            <span>PRA</span>
            <span>PRA</span>
            <span>PRA</span>
            <span>PRA</span>
          </div>
          <div class="logo-panel">
            <span>HA</span>
            <span>GUE</span>
            <span>GA</span>
            <span>G</span>
          </div>
        </div>
        <span class="logo-yay">yay</span>
      </div>

      <!-- ── Navigation ────────────────────────────────── -->
      <nav>
        <a href="#travel"      class="nav-link">Travel</a>
        <a href="#cz-food"     class="nav-link">CZ Food</a>
        <a href="#activities"  class="nav-link">Activities</a>
        <a href="#sights"      class="nav-link">Sights</a>
        <a href="#prague-food" class="nav-link">Prague Food &amp; Drink</a>
        <a href="#brno"        class="nav-link">Brno</a>
      </nav>

    </header>

    <main>
      <section id="travel"      class="gallery-section"><div class="gallery-canvas"></div></section>
      <section id="cz-food"     class="gallery-section hidden"><div class="gallery-canvas"></div></section>
      <section id="activities"  class="gallery-section hidden"><div class="gallery-canvas"></div></section>
      <section id="sights"      class="gallery-section hidden"><div class="gallery-canvas"></div></section>
      <section id="prague-food" class="gallery-section hidden"><div class="gallery-canvas"></div></section>
      <section id="brno"        class="gallery-section hidden"><div class="gallery-canvas"></div></section>
    </main>
  </div>

  <script>
  (function () {

    // ── Gallery definitions ─────────────────────────────────────────────
    // Each entry: { label, src (optional), w (px), lp (left as fraction of canvas),
    //               t (top px), r (rotation deg), tip (bubble text) }
    var SECTIONS = {
      'travel': [
        { label: 'Flights',               w: 265, lp: 0.04, t:  30, r: -1.5, tip: 'Flight options to Prague' },
        { label: 'Train options',         w: 252, lp: 0.38, t:  15, r:  1.8, tip: 'Train connections to Czechia' },
        { label: 'Bus routes',            w: 258, lp: 0.68, t:  45, r: -2.0, tip: 'Bus options across the country' },
        { label: 'Car rental',            w: 260, lp: 0.07, t: 400, r:  2.5, tip: 'Car rental info and tips' },
        { label: 'Getting around Prague', w: 265, lp: 0.36, t: 380, r: -1.2, tip: 'Metro, tram, and on foot' },
        { label: 'Airport info',          w: 252, lp: 0.67, t: 410, r:  1.5, tip: 'Václav Havel Airport Prague' },
      ],
      'cz-food': [
        { label: 'Svíčková',       w: 260, lp: 0.05, t:  25, r: -2.0, tip: 'Beef sirloin in cream sauce — the national dish' },
        { label: 'Trdelník',       w: 252, lp: 0.38, t:  15, r:  1.5, tip: 'Spiral chimney pastry, hot and sweet' },
        { label: 'Goulash',        w: 258, lp: 0.68, t:  38, r: -1.8, tip: 'Slow-cooked Czech beef goulash with bread dumplings' },
        { label: 'Smažený sýr',    w: 260, lp: 0.06, t: 390, r:  2.2, tip: 'Fried cheese — a Czech institution' },
        { label: 'Knedlíky',       w: 255, lp: 0.37, t: 375, r: -1.5, tip: 'Bread or potato dumplings — the Czech side dish' },
        { label: 'Pilsner Urquell',w: 258, lp: 0.67, t: 398, r:  1.2, tip: 'The original lager, from Plzeň since 1842' },
      ],
      'activities': [
        { label: 'City walking tour', w: 265, lp: 0.04, t:  30, r: -1.8, tip: 'Explore Old Town and Malá Strana on foot' },
        { label: 'Beer tasting',      w: 258, lp: 0.38, t:  20, r:  2.0, tip: 'Dive into Czech beer culture' },
        { label: 'Day trips',         w: 252, lp: 0.68, t:  45, r: -1.5, tip: 'Kutná Hora, Český Krumlov, Karlovy Vary…' },
        { label: 'Kayaking',          w: 260, lp: 0.06, t: 392, r:  1.8, tip: 'On the Vltava river through Prague' },
        { label: 'Historical tours',  w: 265, lp: 0.36, t: 378, r: -2.2, tip: 'Guided walks through centuries of history' },
        { label: 'Local markets',     w: 252, lp: 0.67, t: 402, r:  1.5, tip: 'Náplavka, Manifesto, Holešovice market…' },
      ],
      'sights': [
        { label: 'Prague Castle',       w: 265, lp: 0.04, t:  20, r: -2.0, tip: 'The largest ancient castle complex in the world' },
        { label: 'Charles Bridge',      w: 258, lp: 0.38, t:  35, r:  1.5, tip: 'Gothic bridge lined with Baroque saints' },
        { label: 'Old Town Square',     w: 262, lp: 0.68, t:  25, r: -1.5, tip: 'Heart of the old city, full of life and history' },
        { label: 'Astronomical Clock',  w: 252, lp: 0.06, t: 388, r:  2.2, tip: 'Orloj — medieval mechanical marvel on Old Town Hall' },
        { label: 'Vyšehrad',            w: 262, lp: 0.37, t: 375, r: -1.8, tip: 'Ancient fortress and cemetery with incredible city views' },
        { label: 'Josefov',             w: 258, lp: 0.67, t: 400, r:  1.2, tip: 'The former Jewish Quarter — synagogues and the Old Cemetery' },
      ],
      'prague-food': [
        { label: 'Restaurant picks', w: 262, lp: 0.04, t:  30, r: -1.5, tip: 'Top picks for a proper sit-down dinner' },
        { label: 'Wine bars',         w: 252, lp: 0.38, t:  15, r:  2.0, tip: 'Bohemian and Moravian wine scene' },
        { label: 'Craft beer spots',  w: 258, lp: 0.68, t:  40, r: -2.0, tip: 'Beyond the Pilsner — microbreweries and tap rooms' },
        { label: 'Coffee shops',      w: 262, lp: 0.07, t: 392, r:  1.8, tip: 'Third wave coffee is thriving in Prague' },
        { label: 'Farmers markets',   w: 265, lp: 0.36, t: 375, r: -1.2, tip: 'Náplavka riverbank market on weekends' },
        { label: 'Late night spots',  w: 252, lp: 0.66, t: 400, r:  2.2, tip: 'Prague after midnight — bars, clubs, and kebabs' },
      ],
      'brno': [
        { label: 'Getting to Brno',  w: 262, lp: 0.04, t:  25, r: -1.8, tip: 'Fast train from Prague: ~2.5 hrs, highly recommended' },
        { label: 'Old Town',         w: 252, lp: 0.38, t:  15, r:  1.5, tip: 'Zelný trh (Cabbage Market) and the old lanes' },
        { label: 'Špilberk Castle',  w: 262, lp: 0.68, t:  40, r: -2.2, tip: 'Castle turned Habsburg prison — great city views' },
        { label: 'Food scene',       w: 258, lp: 0.06, t: 388, r:  2.0, tip: 'Brno has a quietly brilliant restaurant and café scene' },
        { label: 'Day trip tips',    w: 265, lp: 0.36, t: 375, r: -1.5, tip: 'Moravian karst caves, Lednice Palace, wine country' },
        { label: 'Where to stay',    w: 252, lp: 0.67, t: 398, r:  1.8, tip: 'Hotel and Airbnb recommendations for Brno' },
      ],
    };

    // ── Global hover bubble ─────────────────────────────────────────────
    var bubble = document.createElement('div');
    bubble.className = 'win-bubble';
    document.body.appendChild(bubble);

    function showBubble(win, text) {
      bubble.textContent = text;
      var rect = win.getBoundingClientRect();
      bubble.style.left = rect.left + 'px';
      bubble.style.top  = (rect.bottom + 10) + 'px';
      bubble.classList.add('visible');
    }
    function hideBubble() { bubble.classList.remove('visible'); }

    // ── Build galleries ─────────────────────────────────────────────────
    var zTop = 10;

    function buildGallery(sectionId, defs) {
      var canvas = document.querySelector('#' + sectionId + ' .gallery-canvas');
      if (!canvas) return;

      defs.forEach(function (def, i) {
        var win = document.createElement('div');
        win.className = 'win';
        win.style.width     = def.w + 'px';
        win.style.transform = 'rotate(' + def.r + 'deg)';
        win.style.zIndex    = i + 1;
        win.dataset.lp = def.lp;
        win.dataset.t  = def.t;

        // Title bar
        var bar = document.createElement('div');
        bar.className = 'win-bar';
        var title = document.createElement('span');
        title.textContent = def.label;
        bar.appendChild(title);
        var dots = document.createElement('div');
        dots.className = 'win-bar-dots';
        for (var d = 0; d < 9; d++) {
          var dot = document.createElement('span');
          dots.appendChild(dot);
        }
        bar.appendChild(dots);
        win.appendChild(bar);

        // Body
        var body = document.createElement('div');
        body.className = 'win-body';
        if (def.src) {
          var img = document.createElement('img');
          img.src = def.src;
          img.alt = def.label;
          body.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'win-placeholder';
          body.appendChild(ph);
        }
        win.appendChild(body);
        canvas.appendChild(win);

        // ── Drag ─────────────────────────────────────────────────────────
        var dragging = false, startMX, startMY, startL, startT;

        bar.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          e.preventDefault();
          dragging = true;
          win.classList.add('dragging');
          win.style.zIndex = ++zTop;
          win.dataset.dragged = '1';
          document.body.style.cursor = 'grabbing';
          document.body.style.userSelect = 'none';
          startMX = e.clientX; startMY = e.clientY;
          startL  = win.offsetLeft; startT = win.offsetTop;

          function onMove(e) {
            if (!dragging) return;
            win.style.left = (startL + e.clientX - startMX) + 'px';
            win.style.top  = (startT + e.clientY - startMY) + 'px';
            // Keep bubble in sync while dragging
            if (bubble.classList.contains('visible')) {
              var r = win.getBoundingClientRect();
              bubble.style.left = r.left + 'px';
              bubble.style.top  = (r.bottom + 10) + 'px';
            }
          }
          function onUp() {
            dragging = false;
            win.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });

        win.addEventListener('mousedown', function () {
          win.style.zIndex = ++zTop;
        });

        // ── Bubble ────────────────────────────────────────────────────────
        if (def.tip) {
          win.addEventListener('mouseenter', function () { showBubble(win, def.tip); });
          win.addEventListener('mouseleave', hideBubble);
        }
      });
    }

    // ── Position windows ────────────────────────────────────────────────
    function positionSection(id) {
      var canvas = document.querySelector('#' + id + ' .gallery-canvas');
      if (!canvas) return;
      var W = canvas.offsetWidth;
      canvas.querySelectorAll('.win').forEach(function (win) {
        if (!win.dataset.dragged) {
          win.style.left = Math.round(parseFloat(win.dataset.lp) * W) + 'px';
          win.style.top  = win.dataset.t + 'px';
        }
      });
    }

    // ── Navigation ──────────────────────────────────────────────────────
    function navigate() {
      var hash = window.location.hash || '#travel';
      document.querySelectorAll('.gallery-section').forEach(function (s) { s.classList.add('hidden'); });
      document.querySelectorAll('.nav-link').forEach(function (l) { l.classList.remove('active'); });
      var section = document.querySelector(hash);
      var link    = document.querySelector('a[href="' + hash + '"]');
      if (section) { section.classList.remove('hidden'); positionSection(hash.slice(1)); }
      if (link)    { link.classList.add('active'); }
      hideBubble();
    }

    // ── Init ────────────────────────────────────────────────────────────
    Object.keys(SECTIONS).forEach(function (id) { buildGallery(id, SECTIONS[id]); });
    navigate();
    window.addEventListener('hashchange', navigate);
    window.addEventListener('resize', function () {
      positionSection((window.location.hash || '#travel').slice(1));
    });

  })();
  </script>
</body>
</html>
