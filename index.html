<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prague Yay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital@1&family=Inter:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>

      <!-- ── Logo ──────────────────────────────────────── -->
      <div class="logo">
        <div class="logo-mark">
          <div class="logo-panel">
            <span>PRA</span>
            <span>PRA</span>
            <span>PRA</span>
            <span>PRA</span>
          </div>
          <div class="logo-panel">
            <span>HA</span>
            <span>GUE</span>
            <span>GA</span>
            <span>G</span>
          </div>
        </div>
        <span class="logo-yay">yay</span>
      </div>

      <!-- ── Navigation ────────────────────────────────── -->
      <nav>
        <a href="#travel"      class="nav-link">Travel</a>
        <a href="#cz-food"     class="nav-link">CZ Food</a>
        <a href="#activities"  class="nav-link">Activities</a>
        <a href="#sights"      class="nav-link">Sights</a>
        <a href="#prague-food" class="nav-link">Prague Food &amp; Drink</a>
        <a href="#brno"        class="nav-link">Brno</a>
      </nav>

    </header>

    <main>
      <!-- Travel section: JS builds subgroups inside -->
      <section id="travel"      class="gallery-section"></section>
      <section id="cz-food"     class="gallery-section hidden"><div class="gallery-canvas"></div></section>
      <section id="activities"  class="gallery-section hidden"><div class="gallery-canvas"></div></section>
      <section id="sights"      class="gallery-section hidden"><div class="gallery-canvas"></div></section>
      <section id="prague-food" class="gallery-section hidden"><div class="gallery-canvas"></div></section>
      <section id="brno"        class="gallery-section hidden"><div class="gallery-canvas"></div></section>
    </main>
  </div>

  <script>
  (function () {

    // ── Section definitions ─────────────────────────────────────────────
    //
    // Flat array  → single gallery canvas (all sections except travel)
    // { subgroups } → multiple titled sub-canvases (travel)
    //
    // Card fields:
    //   label, w, lp, t, r, tip — always required
    //   src                     — image path (omit for placeholder)
    //   type: 'info', html      — text card instead of image

    var SECTIONS = {

      // ── Travel (subgroups) ──────────────────────────────────────────────
      'travel': {
        subgroups: [
          {
            title: 'Zurich — Prague',
            height: 340,
            cards: [
              { label: 'Flights (ZRH / BSL)',
                src: 'assets/travel/easyjet-zurich.jpg',
                w: 272, lp: 0.03, t: 28, r: -1.5,
                tip: 'EasyJet and Swiss fly direct from Zurich (ZRH). Ryanair and easyJet from Basel/Mulhouse (BSL/EAP).' },
              { label: 'Flixbus',
                src: 'assets/travel/flixbus.jpg',
                w: 255, lp: 0.37, t: 18, r:  1.8,
                tip: 'Affordable coach across Europe. Book on flixbus.com' },
              { label: 'Regiojet bus',
                src: 'assets/travel/regiojet-bus.jpg',
                w: 260, lp: 0.67, t: 32, r: -2.0,
                tip: 'Czech operator with free snacks and wifi on board. Book on regiojet.com' },
            ]
          },
          {
            title: 'Prague — Brno',
            height: 300,
            cards: [
              { label: 'Regiojet train',
                src: 'assets/travel/regiojet-train.jpg',
                w: 272, lp: 0.07, t: 24, r:  1.5,
                tip: 'Yellow trains, ~2.5h Prague → Brno. Free coffee and wifi. Book on regiojet.com' },
              { label: 'České dráhy',
                src: 'assets/travel/ceske-drahy.jpg',
                w: 258, lp: 0.54, t: 14, r: -1.8,
                tip: 'Czech national rail — multiple departures daily. All trains at idos.cz or cd.cz' },
            ]
          },
          {
            title: 'Around Prague',
            height: 290,
            cards: [
              { label: 'DPP — Metro &amp; Tram',
                src: 'assets/travel/prague-tram.jpg',
                w: 272, lp: 0.04, t: 24, r: -1.8,
                tip: 'One ticket covers metro, tram, and bus. Timetables: dpp.cz and idos.cz' },
              { label: 'Tickets &amp; Fares',
                type: 'info',
                w: 265, lp: 0.44, t: 16, r:  1.5,
                tip: 'All passes valid on metro, tram and bus',
                html: '<b>24h ticket</b> — 140 Kč<br><b>72h ticket</b> — 340 Kč<br><br><b>Monthly (under 26)</b><br>130 Kč<br><br><a href="https://www.dpp.cz" target="_blank">↗ dpp.cz</a> &nbsp;·&nbsp; <a href="https://idos.cz" target="_blank">↗ idos.cz</a>' },
            ]
          },
          {
            title: 'Around Czechia',
            height: 265,
            cards: [
              { label: 'idos.cz',
                type: 'info',
                w: 300, lp: 0.05, t: 22, r: -1.5,
                tip: 'The Czech transport bible — search any connection',
                html: 'All trains &amp; buses in Czechia — Regiojet, České dráhy, FlixBus and every regional connection.<br><br><a href="https://idos.cz" target="_blank">↗ idos.cz</a>' },
              { label: 'How to use',
                type: 'info',
                w: 265, lp: 0.53, t: 14, r:  1.8,
                tip: 'Enter from → to and pick a date',
                html: 'Enter origin &amp; destination, pick a date, and choose from all available buses and trains sorted by time and price.' },
            ]
          },
        ]
      },

      // ── CZ Food ─────────────────────────────────────────────────────────
      'cz-food': [
        { label: 'Svíčková',             src: 'assets/czechfood/svickova.png',                 w: 270, lp: 0.03, t:  25, r: -1.8, tip: 'Beef sirloin in vegetable-cream sauce with a dollop of cranberry — the national dish' },
        { label: 'Goulash',              src: 'assets/czechfood/goulash.jpg',                  w: 258, lp: 0.37, t:  15, r:  1.5, tip: 'Slow-cooked Czech beef goulash served with bread dumplings' },
        { label: 'Dill cream beef',      src: 'assets/czechfood/dill-cream-beef.webp',         w: 255, lp: 0.68, t:  38, r: -2.0, tip: 'Braised beef in a silky dill-cream sauce — a Czech Sunday classic' },
        { label: 'Smažený sýr',          src: 'assets/czechfood/smazeny-syr.jpg',              w: 262, lp: 0.12, t: 350, r:  2.2, tip: 'Fried cheese — a Czech institution, usually with tartar sauce' },
        { label: 'Fried cheese triathlon', src: 'assets/czechfood/fried-cheese-triathlon.jpg', w: 255, lp: 0.52, t: 335, r: -1.5, tip: 'The full Czech triathlon: fried cheese + fries + potato salad, all on one plate' },
        { label: 'Ovocné knedlíky',      src: 'assets/czechfood/fruit-dumplings.jpg',          w: 258, lp: 0.05, t: 560, r: -2.2, tip: 'Fruit-filled dumplings with melted butter, tvaroh (Czech curd), and sugar' },
        { label: 'Řízek',                src: 'assets/czechfood/rizek.jpg',                    w: 260, lp: 0.55, t: 545, r:  1.8, tip: 'Czech schnitzel — breaded and fried pork, served with mash, boiled potatoes, or fries' },
      ],

      // ── Activities ──────────────────────────────────────────────────────
      'activities': [
        { label: 'City walking tour', w: 265, lp: 0.04, t:  30, r: -1.8, tip: 'Explore Old Town and Malá Strana on foot' },
        { label: 'Beer tasting',      w: 258, lp: 0.38, t:  20, r:  2.0, tip: 'Dive into Czech beer culture' },
        { label: 'Day trips',         w: 252, lp: 0.68, t:  45, r: -1.5, tip: 'Kutná Hora, Český Krumlov, Karlovy Vary…' },
        { label: 'Kayaking',          w: 260, lp: 0.06, t: 392, r:  1.8, tip: 'On the Vltava river through Prague' },
        { label: 'Historical tours',  w: 265, lp: 0.36, t: 378, r: -2.2, tip: 'Guided walks through centuries of history' },
        { label: 'Local markets',     w: 252, lp: 0.67, t: 402, r:  1.5, tip: 'Náplavka, Manifesto, Holešovice market…' },
      ],

      // ── Sights ──────────────────────────────────────────────────────────
      'sights': [
        { label: 'Prague Castle',      w: 265, lp: 0.04, t:  20, r: -2.0, tip: 'The largest ancient castle complex in the world' },
        { label: 'Charles Bridge',     w: 258, lp: 0.38, t:  35, r:  1.5, tip: 'Gothic bridge lined with Baroque saints' },
        { label: 'Old Town Square',    w: 262, lp: 0.68, t:  25, r: -1.5, tip: 'Heart of the old city, full of life and history' },
        { label: 'Astronomical Clock', w: 252, lp: 0.06, t: 388, r:  2.2, tip: 'Orloj — medieval mechanical marvel on Old Town Hall' },
        { label: 'Vyšehrad',           w: 262, lp: 0.37, t: 375, r: -1.8, tip: 'Ancient fortress and cemetery with incredible city views' },
        { label: 'Josefov',            w: 258, lp: 0.67, t: 400, r:  1.2, tip: 'The former Jewish Quarter — synagogues and the Old Cemetery' },
      ],

      // ── Prague Food & Drink ─────────────────────────────────────────────
      'prague-food': [
        { label: 'Restaurant picks', w: 262, lp: 0.04, t:  30, r: -1.5, tip: 'Top picks for a proper sit-down dinner' },
        { label: 'Wine bars',        w: 252, lp: 0.38, t:  15, r:  2.0, tip: 'Bohemian and Moravian wine scene' },
        { label: 'Craft beer spots', w: 258, lp: 0.68, t:  40, r: -2.0, tip: 'Beyond the Pilsner — microbreweries and tap rooms' },
        { label: 'Coffee shops',     w: 262, lp: 0.07, t: 392, r:  1.8, tip: 'Third wave coffee is thriving in Prague' },
        { label: 'Farmers markets',  w: 265, lp: 0.36, t: 375, r: -1.2, tip: 'Náplavka riverbank market on weekends' },
        { label: 'Late night spots', w: 252, lp: 0.66, t: 400, r:  2.2, tip: 'Prague after midnight — bars, clubs, and kebabs' },
      ],

      // ── Brno ────────────────────────────────────────────────────────────
      'brno': [
        { label: 'Getting to Brno', w: 262, lp: 0.04, t:  25, r: -1.8, tip: 'Fast train from Prague: ~2.5 hrs, highly recommended' },
        { label: 'Old Town',        w: 252, lp: 0.38, t:  15, r:  1.5, tip: 'Zelný trh (Cabbage Market) and the old lanes' },
        { label: 'Špilberk Castle', w: 262, lp: 0.68, t:  40, r: -2.2, tip: 'Castle turned Habsburg prison — great city views' },
        { label: 'Food scene',      w: 258, lp: 0.06, t: 388, r:  2.0, tip: 'Brno has a quietly brilliant restaurant and café scene' },
        { label: 'Day trip tips',   w: 265, lp: 0.36, t: 375, r: -1.5, tip: 'Moravian karst caves, Lednice Palace, wine country' },
        { label: 'Where to stay',   w: 252, lp: 0.67, t: 398, r:  1.8, tip: 'Hotel and Airbnb recommendations for Brno' },
      ],
    };

    // ── Global hover bubble ─────────────────────────────────────────────
    var bubble = document.createElement('div');
    bubble.className = 'win-bubble';
    document.body.appendChild(bubble);

    function showBubble(win, text) {
      bubble.textContent = text;
      var rect = win.getBoundingClientRect();
      bubble.style.left = rect.left + 'px';
      bubble.style.top  = (rect.bottom + 10) + 'px';
      bubble.classList.add('visible');
    }
    function hideBubble() { bubble.classList.remove('visible'); }

    // ── Core window builder ─────────────────────────────────────────────
    var zTop = 10;

    function buildGalleryInCanvas(canvas, defs) {
      defs.forEach(function (def, i) {
        var win = document.createElement('div');
        win.className = 'win';
        win.style.width     = def.w + 'px';
        win.style.transform = 'rotate(' + def.r + 'deg)';
        win.style.zIndex    = i + 1;
        win.dataset.lp = def.lp;
        win.dataset.t  = def.t;

        // Title bar
        var bar = document.createElement('div');
        bar.className = 'win-bar';
        var titleEl = document.createElement('span');
        titleEl.innerHTML = def.label;
        bar.appendChild(titleEl);
        var dots = document.createElement('div');
        dots.className = 'win-bar-dots';
        for (var d = 0; d < 9; d++) { dots.appendChild(document.createElement('span')); }
        bar.appendChild(dots);
        win.appendChild(bar);

        // Body
        var body = document.createElement('div');
        body.className = 'win-body';
        if (def.type === 'info') {
          var info = document.createElement('div');
          info.className = 'win-info';
          info.innerHTML = def.html || '';
          body.appendChild(info);
        } else if (def.src) {
          var img = document.createElement('img');
          img.src = def.src;
          img.alt = def.label;
          body.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'win-placeholder';
          body.appendChild(ph);
        }
        win.appendChild(body);
        canvas.appendChild(win);

        // Drag
        var dragging = false, startMX, startMY, startL, startT;
        bar.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          e.preventDefault();
          dragging = true;
          win.classList.add('dragging');
          win.style.zIndex = ++zTop;
          win.dataset.dragged = '1';
          document.body.style.cursor = 'grabbing';
          document.body.style.userSelect = 'none';
          startMX = e.clientX; startMY = e.clientY;
          startL  = win.offsetLeft; startT = win.offsetTop;

          function onMove(e) {
            if (!dragging) return;
            win.style.left = (startL + e.clientX - startMX) + 'px';
            win.style.top  = (startT + e.clientY - startMY) + 'px';
            if (bubble.classList.contains('visible')) {
              var r = win.getBoundingClientRect();
              bubble.style.left = r.left + 'px';
              bubble.style.top  = (r.bottom + 10) + 'px';
            }
          }
          function onUp() {
            dragging = false;
            win.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
        win.addEventListener('mousedown', function () { win.style.zIndex = ++zTop; });

        // Bubble
        if (def.tip) {
          win.addEventListener('mouseenter', function () { showBubble(win, def.tip); });
          win.addEventListener('mouseleave', hideBubble);
        }
      });
    }

    // ── Section builder ─────────────────────────────────────────────────
    function buildSection(sectionId, data) {
      if (Array.isArray(data)) {
        // Flat array → single gallery-canvas already in HTML
        buildGalleryInCanvas(
          document.querySelector('#' + sectionId + ' .gallery-canvas'),
          data
        );
      } else if (data.subgroups) {
        // Subgroups → build titled canvases
        var section = document.getElementById(sectionId);
        data.subgroups.forEach(function (group) {
          var sg = document.createElement('div');
          sg.className = 'subgroup';

          var heading = document.createElement('h3');
          heading.className = 'subgroup-title';
          heading.textContent = group.title;
          sg.appendChild(heading);

          var canvas = document.createElement('div');
          canvas.className = 'gallery-canvas';
          canvas.style.height = (group.height || 340) + 'px';
          sg.appendChild(canvas);

          section.appendChild(sg);
          buildGalleryInCanvas(canvas, group.cards);
        });
      }
    }

    // ── Position all canvases in a section ──────────────────────────────
    function positionSection(id) {
      var section = document.getElementById(id);
      if (!section) return;
      section.querySelectorAll('.gallery-canvas').forEach(function (canvas) {
        var W = canvas.offsetWidth;
        canvas.querySelectorAll('.win').forEach(function (win) {
          if (!win.dataset.dragged) {
            win.style.left = Math.round(parseFloat(win.dataset.lp) * W) + 'px';
            win.style.top  = win.dataset.t + 'px';
          }
        });
      });
    }

    // ── Navigation ──────────────────────────────────────────────────────
    function navigate() {
      var hash = window.location.hash || '#travel';
      document.querySelectorAll('.gallery-section').forEach(function (s) { s.classList.add('hidden'); });
      document.querySelectorAll('.nav-link').forEach(function (l) { l.classList.remove('active'); });
      var section = document.querySelector(hash);
      var link    = document.querySelector('a[href="' + hash + '"]');
      if (section) { section.classList.remove('hidden'); positionSection(hash.slice(1)); }
      if (link)    { link.classList.add('active'); }
      hideBubble();
    }

    // ── Init ────────────────────────────────────────────────────────────
    Object.keys(SECTIONS).forEach(function (id) { buildSection(id, SECTIONS[id]); });
    navigate();
    window.addEventListener('hashchange', navigate);
    window.addEventListener('resize', function () {
      positionSection((window.location.hash || '#travel').slice(1));
    });

  })();
  </script>
</body>
</html>
